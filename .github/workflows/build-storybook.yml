name: Build Storybook

on:
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy to Chromatic
        run: npx chromatic --project-token=${{ secrets.CHROMATIC_PROJECT_TOKEN }} --exit-zero-on-changes
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      - name: Notify Discord
        run: |
          COMMIT_MESSAGE=$(git log -1 --pretty=%s)
          BUILD_NUMBER=${{ github.run_number }}
          BRANCH_NAME=${GITHUB_REF##*/}
          STORYBOOK_URL="https://www.chromatic.com/builds?appId=67fd2a40cad99feac1d5563d"

          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [
                {
                  \"title\": \"📘 Storybook 배포 완료\",
                  \"color\": 3447003,
                  \"fields\": [
                    {
                      \"name\": \"🔢 Build Number\",
                      \"value\": \"#${BUILD_NUMBER}\",
                      \"inline\": false
                    },
                    {
                      \"name\": \"🌿 Branch\",
                      \"value\": \"${BRANCH_NAME}\",
                      \"inline\": false
                    },
                    {
                      \"name\": \"💬 Commit Message\",
                      \"value\": \"${COMMIT_MESSAGE}\",
                      \"inline\": false
                    },
                    {
                      \"name\": \"🔗 URL\",
                      \"value\": \"[스토리북 열기](${STORYBOOK_URL})\"
                    }
                  ],
                  \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
                }
              ]
            }" \
            ${{ secrets.DISCORD_BUILD_WEBHOOK_URL }}