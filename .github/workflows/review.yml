name: Review

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches-ignore:
      - 'release/**'

jobs:
  chromatic:
    runs-on: ubuntu-latest

    steps:
      - name: Check repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Install dependencies
        run: npm ci

      - name: Run Chromatic and extract review URL
        id: chromatic
        run: |
          npx chromatic \
          --project-token=${{ secrets.CHROMATIC_PROJECT_TOKEN }} \
          --branch=$GITHUB_HEAD_REF \
          --commit=$GITHUB_SHA \
          --exit-zero-on-changes \
          --json > chromatic-output.json 2>&1
      
          echo "✅ 🔍 Raw output ↓"
          cat chromatic-output.json
      
          BUILD_URL=$(grep -o 'https://www.chromatic.com/build?appId=[^"]*' chromatic-output.json | head -n 1)
          echo "BUILD_URL=$BUILD_URL" >> $GITHUB_ENV

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get PR Info
        run: |
          PR_TITLE=$(jq -r .pull_request.title < "$GITHUB_EVENT_PATH")
          PR_AUTHOR=$(jq -r .pull_request.user.login < "$GITHUB_EVENT_PATH")
          PR_URL=$(jq -r .pull_request.html_url < "$GITHUB_EVENT_PATH")

          echo "PR_TITLE=$PR_TITLE" >> $GITHUB_ENV
          echo "PR_AUTHOR=$PR_AUTHOR" >> $GITHUB_ENV
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV

      - name: Notify Discord
        continue-on-error: true
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          DISCORD_REVIEW_WEBHOOK_URL: ${{ secrets.DISCORD_REVIEW_WEBHOOK_URL }}
        run: |
          PR_TITLE=$(jq -r .pull_request.title < "$GITHUB_EVENT_PATH")
          PR_AUTHOR=$(jq -r .pull_request.user.login < "$GITHUB_EVENT_PATH")
          PR_URL=$(jq -r .pull_request.html_url < "$GITHUB_EVENT_PATH")
          
          echo "✅ PR_TITLE=$PR_TITLE"
          echo "✅ PR_AUTHOR=$PR_AUTHOR"
          echo "✅ PR_URL=$PR_URL"
          
          if [ -z "$BUILD_URL" ]; then
            echo "ℹ️ Falling back to grep for BUILD_URL"
            BUILD_URL=$(grep -o 'https://www.chromatic.com/build?appId=[^"]*' chromatic-output.json | head -n 1)
          fi
          
          if [ -z "$BUILD_URL" ]; then
            echo "❌ BUILD_URL is empty. Full chromatic-output.json ↓"
            cat chromatic-output.json
            echo "❌ Skipping Discord notification."
            exit 0
          fi
          
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          
          echo "✅ BUILD_URL=$BUILD_URL"
          echo "✅ TIMESTAMP=$TIMESTAMP"
          
          echo "✅ CHROMATIC_PROJECT_TOKEN=$CHROMATIC_PROJECT_TOKEN"
          echo "✅ DISCORD_REVIEW_WEBHOOK_URL=$DISCORD_REVIEW_WEBHOOK_URL"
          
          if [ -z "$BUILD_URL" ]; then
            echo "❌ BUILD_URL is empty. Skipping Discord notification."
            exit 0
          fi
          
          jq --version || echo "❌ jq not installed"
          
          jq -n \
          --arg buildUrl "$BUILD_URL" \
          --arg prTitle "$PR_TITLE" \
          --arg prAuthor "$PR_AUTHOR" \
          --arg prUrl "$PR_URL" \
          --arg timestamp "$TIMESTAMP" \
          '{
              embeds: [
                {
                  title: "📘 Storybook 리뷰가 생성되었습니다!",
                  color: 3447003,
                  fields: [
                    { name: "🔗 리뷰 링크", value: "[Chromatic 리뷰 보기](\($buildUrl))" },
                    { name: "📌 PR 제목", value: $prTitle },
                    { name: "🙋 작성자", value: $prAuthor },
                    { name: "🔁 PR 링크", value: "[\($prUrl)](\($prUrl))" }
                  ],
                  timestamp: $timestamp
                }
              ]
            }' > payload.json || echo "❌ jq failed"
          
          ls -la payload.json || echo "❌ payload.json not found"
          
          echo "✅ 🔍 payload preview ↓"
          cat payload.json || echo "❌ payload.json not found"
          
          echo "✅ curl about to run"
          curl -v -H "Content-Type: application/json" \
            -d @payload.json "$DISCORD_REVIEW_WEBHOOK_URL" > curl-response.log 2>&1
          echo "✅ 🔍 curl response ↓"
          cat curl-response.log || echo "❌ curl-response.log not found"
          CURL_EXIT_CODE=$?
          echo "✅ curl finished with exit code $CURL_EXIT_CODE"
          
          CURL_EXIT_CODE=$?
          echo "✅ curl finished with exit code $CURL_EXIT_CODE"
          
          echo "✅ 🔍 curl response ↓"
          if [ -f curl-response.log ]; then
            echo "----- BEGIN curl-response.log -----"
            cat curl-response.log
            echo "----- END curl-response.log -----"
          else
            echo "❌ curl-response.log not found"
          fi
          
          exit 0