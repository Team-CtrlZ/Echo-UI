name: Review

on:
  pull_request:
    types:
      - opened
      - synchronize


jobs:
  chromatic:
    runs-on: ubuntu-latest

    steps:
      - name: Check repository
        uses: actions/checkout@v3
        with:
          fetch-depth: '0'

      - name: Install dependencies
        run: npm ci

      - name: Run Chromatic and capture build URL
        id: chromatic
        run: |
            OUTPUT=$(npx chromatic --project-token=${{ secrets.CHROMATIC_PROJECT_TOKEN }} --exit-zero-on-changes --json)
            echo "$OUTPUT" > chromatic-output.json
            
            BUILD_URL=$(jq -r '.build.webUrl' chromatic-output.json)
            echo "BUILD_URL=$BUILD_URL" >> $GITHUB_ENV

      - name: Notify Discord
        run: |
          COMMIT_MESSAGE=$(git log -1 --pretty=%s)
          BUILD_NUMBER=${{ github.run_number }}
          BRANCH_NAME=${GITHUB_REF##*/}
          PR_URL="${{ github.event.pull_request.html_url }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_AUTHOR="${{ github.event.pull_request.user.login }}"

          # Chromatic 리뷰 URL 추출
          BUILD_URL=$(jq -r '.build.webUrl' chromatic-output.json)

          curl -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [
                {
                  \"title\": \"📘 Storybook 리뷰가 생성되었습니다!\",
                  \"color\": 3447003,
                  \"fields\": [
                    {
                      \"name\": \"🔗 리뷰 링크\",
                      \"value\": \"[Chromatic 리뷰 보기](${BUILD_URL})\"
                    },
                    {
                      \"name\": \"📌 PR 제목\",
                      \"value\": \"${PR_TITLE}\"
                    },
                    {
                      \"name\": \"🙋 작성자\",
                      \"value\": \"${PR_AUTHOR}\",
                      \"inline\": true
                    },
                    {
                      \"name\": \"🔁 PR 링크\",
                      \"value\": \"[${PR_URL}](${PR_URL})\",
                      \"inline\": true
                    }
                  ],
                  \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
                }
              ]
            }" \
            ${{ secrets.DISCORD_REVIEW_WEBHOOK_URL }}